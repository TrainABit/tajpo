name: Release

# Push a tag like v0.3.0 to build, sign, notarize, and draft a GitHub Release.
#
# Required repository secrets:
#   DEVELOPER_ID_P12_BASE64    base64 of the exported "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  its export password
#   SIGN_IDENTITY              e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_KEY_P8_BASE64       base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID              the key's ID
#   NOTARY_ISSUER              the issuer ID
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: swift test

      - name: Import the signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, and notarize
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh --dmg
          rm -f "$NOTARY_KEY_PATH"

      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/Tajpo-$VERSION.dmg" "build/Tajpo-$VERSION.dmg.sha256" "build/Tajpo-$VERSION.dSYM.zip" \
            --title "Tajpo $VERSION" --generate-notes --draft

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
