name: Preview app artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tajpo-preview-app
          path: build/Tajpo.app
