name: UI snapshots

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ui-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build app
        run: scripts/build-app.sh
      - name: First-launch smoke test
        run: |
          defaults delete com.trainabit.tajpo 2>/dev/null || true
          mkdir -p snapshots
          open build/Tajpo.app
          sleep 8
          pkill -x Tajpo || true
      - name: Capture scenes
        run: scripts/capture-snapshots.sh
      - name: Publish snapshots
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd snapshots
          printf "Source: %s @ %s\n" "$GITHUB_REF_NAME" "$GITHUB_SHA" > README.md
          git init -q
          git checkout -q -b ci-snapshots
          git add -A
          git -c user.name="tajpo-ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Snapshots for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-snapshots
