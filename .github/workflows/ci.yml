name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  macos:
    name: Build, test, and bundle (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: xcodebuild -version && swift --version
      - run: swift build
      - run: swift test
      - name: Build Tajpo.app (ad hoc signed, for testing only)
        run: scripts/build-app.sh --dmg
      - name: Verify the bundle
        run: |
          lipo -archs build/Tajpo.app/Contents/MacOS/Tajpo
          plutil -lint build/Tajpo.app/Contents/Info.plist
          codesign -dvv build/Tajpo.app
      - uses: actions/upload-artifact@v5
        with:
          name: Tajpo-dev-build
          path: |
            build/Tajpo-*.dmg
            build/Tajpo-*.dSYM.zip
          if-no-files-found: error
          retention-days: 14
