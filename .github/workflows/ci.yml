name: CI

on:
  push:
  pull_request:

jobs:
  core-tests-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  macos:
    name: Build, test, and bundle (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: Build Tajpo.app (ad hoc signed)
        run: scripts/build-app.sh --dmg
      - uses: actions/upload-artifact@v5
        with:
          name: Tajpo
          path: build/Tajpo-*.dmg
